# yaml-language-server: $schema=https://textla.dev/yass/v1.schema.json
---
description: >
  The index command. Emits one line per spec and design document in the project, giving
  an agent the whole map of the spec set at structural cost only, with no obligation
  prose and no descriptions.
version: v1
---
spec: List
INPUT:
- MUST: accept the loaded model
  CONFORMS: 01-load@Load::RETURN
- MUST: rely on the model holding every document beneath the project root, and re-walk the filesystem for none of them
- MUST: rely on every document carrying a file path, a position, a kind, and a name, all recorded during loading
- MUST: rely on those guarantees holding without a violation case of its own, because loading exits before any command runs when a file cannot be parsed
  SEE: 01-load@Load::ERROR
- WHEN: the model holds no spec and no design document
  MUST: write nothing to stdout and exit 1
  SEE: 00-output@ExitCode
- MUST-NOT: accept a positional argument
- MUST-NOT: accept an option beside the global options
  SEE: root@Cli
RETURN:
- MUST: "emit one record per spec document and per design document, in the form `<kind> <ref> <detail>`"
  USES: 00-output@RecordGrammar
- MUST: "emit `spec` or `design` as `<kind>`"
- MUST: "emit `<path>@<Name>` as `<ref>`, the path taken relative to the project root with the `.yass.yaml` suffix removed"
- WHEN: the document is a spec that declares at least one slot
  MUST: "emit `<detail>` as the slot names it declares, comma-separated with no spaces, in the canonical order INPUT, RETURN, ERROR, SIDE-EFFECT, INVARIANT"
- WHEN: the document is a spec that declares no slot
  MUST: "emit `-` as `<detail>`"
- WHEN: the document is a design
  MUST: "emit its `type` value as `<detail>`"
- MUST: order records by the project-root-relative file path in byte order, then by document position within the file
- MUST: emit the record for a document exactly once
ERROR:
- WHEN: any positional argument is given
  MUST: report code yass.args.unexpected and exit 2
- WHEN: an option beside the global options is given
  MUST: report code yass.args.unknown_option and exit 2
INVARIANT:
- CONFORMS: 00-output@Output
- MUST: produce byte-identical output for the same project on repeated invocations
- MUST-NOT: read an obligation, a guard, a reference, or a design's content
- MUST-NOT: "emit a preamble, a file `description`, or a record for a file"
- MUST-NOT: omit a document for being unreachable from the root spec, which validate reports instead
  SEE: 06-validate@Validate
- MUST-NOT: fail for any reason beside the argument failures its ERROR slot names and the loading failures it inherits
  SEE: 01-load@Load
