# yaml-language-server: $schema=https://textla.dev/yass/v1.schema.json
---
description: >
  The output contract every command obeys. Owns the line-oriented record grammar written
  to stdout, the diagnostic line written to stderr, the exit-code policy an agent branches
  on, and the economy rules that keep output small enough to read into a context window
  without waste.
version: v1
---
spec: Output
INPUT:
- MUST: accept a sequence of zero or more records a command produced
- MUST: accept a sequence of zero or more diagnostics a command produced
  SEE: Diagnostic
- MUST: accept each record as an ordered list of fields, the last of which MAY be free text
RETURN:
- MUST: write each record to stdout as one line terminated by exactly one LF (U+000A)
  USES: RecordGrammar
- MUST: "separate adjacent fields of a record with a single ASCII space (U+0020)"
- MUST: place a record's free-text field last, so no field after it needs escaping
- MUST: "write `-` in place of a field whose value is absent or empty, rather than two adjacent separators"
- MUST: replace every LF, CR, and TAB inside a field with a single ASCII space before writing it
- MUST: write each diagnostic to stderr as one line
  SEE: Diagnostic
- MUST: treat a validate finding as a record written to stdout rather than as a diagnostic, even though the two share one line format, because a finding is the checking command's result and a diagnostic is a report that the command could not run
  SEE: 06-validate@Validate
- WHEN: a command produced zero records
  MUST: write nothing at all to stdout
  SEE: ExitCode
ERROR:
- WHEN: a write to stdout fails because the reading end of the pipe is closed
  MUST: stop writing immediately and exit 0
- WHEN: a write to stdout or stderr fails for any other reason
  MUST: exit 2 without attempting further output
SIDE-EFFECT:
- MUST: write to stdout and stderr only
- MUST: line-buffer stdout, so a consumer reading incrementally sees whole records
INVARIANT:
- CONFORMS: Diagnostic
- MUST: emit UTF-8 bytes on stdout and on stderr
- MUST: emit LF (U+000A) as the only line terminator on every platform
- MUST: terminate every emitted line, including the last, with exactly one LF
- MUST-NOT: emit a blank line
- MUST-NOT: emit a header row, a column title, a separator rule, a count, a total, or a summary line
- MUST-NOT: emit a sentence of explanatory prose on stdout
- MUST-NOT: emit progress, status, banner, or log output on either stream
- MUST-NOT: emit an ANSI escape sequence, color, or any other terminal formatting
- MUST-NOT: pad a field to a fixed column width or align fields across records
- MUST-NOT: page output or hand output to a pager
- MUST-NOT: alter output in any way according to whether a stream is attached to a terminal
- MUST-NOT: "emit a document's preamble `description` except where a command's RETURN names it"
- MUST-NOT: emit a field a command's RETURN does not name
- MUST-NOT: emit JSON, NDJSON, or any other nested encoding in v1
---
spec: Diagnostic
INPUT:
- MUST: accept a code and a message
- MAY: accept the path of the file the diagnostic concerns
- MAY: accept the 1-based line number of the offending YAML node in that file
RETURN:
- MUST: "write a diagnostic that carries both a path and a line as `<path>:<line>: <code> <message>`"
- MUST: "write a diagnostic that carries a path and no line as `<path>: <code> <message>`"
- MUST: "write a diagnostic that carries no path as `yass: <code> <message>`"
- MUST: "emit `<path>` relative to the project root, with `/` as the separator on every platform and no leading `./`"
- MUST: "emit `<code>` as a dotted token drawn from the characters `a-z`, `0-9`, `.`, and `_`"
- MUST: "emit `<message>` as a lowercase noun phrase naming what is wrong"
- MUST: "limit `<message>` to 100 bytes"
- MUST: write one diagnostic per line
- MUST-NOT: "end `<message>` with a period"
- MUST-NOT: "restate `<code>` inside `<message>`"
- MUST-NOT: suggest a remedy, offer an alternative spelling, quote surrounding source, or explain the rule
ERROR:
- WHEN: "a `<message>` would exceed 100 bytes"
  MUST: truncate it to the longest prefix of at most 100 bytes that ends on a UTF-8 character boundary
- WHEN: "a `<path>` is not under the project root"
  MUST: "emit it as an absolute path, since no relative form exists"
INVARIANT:
- MUST: use one code for one condition, at every site that raises it
- MUST: keep a code stable across releases once published, so an agent may branch on it
- MUST-NOT: emit a code that no obligation in this project defines
- MUST-NOT: localize or translate a message
---
spec: ExitCode
RETURN:
- MUST: exit 0 when the command ran and produced its result
- WHEN: the command ran and its result is empty because nothing matched
  MUST: exit 1
- WHEN: validate emitted at least one finding
  MUST: exit 1
  SEE: 06-validate@Validate
- WHEN: the invocation is malformed, a path is unusable, no project root is found, or a file fails to parse
  MUST: exit 2
- WHEN: the process receives SIGINT
  MUST: exit 130 after flushing any pending diagnostic
- WHEN: the process receives SIGTERM
  MUST: exit 143 after flushing any pending diagnostic
- MUST-NOT: exit with any status other than 0, 1, 2, 130, and 143
INVARIANT:
- MUST: separate the ran-and-found-nothing outcome (1) from the could-not-run outcome (2), so an agent branches on status without parsing stderr
- MUST-NOT: exit 1 for a malformed invocation, which is always 2
- MUST-NOT: exit 2 for an empty result, which is always 1
---
design: RecordGrammar
type: grammar
content: |
  Every byte written to stdout matches one of the record productions below.
  ABNF core rules (ALPHA, DIGIT, SP, LF) carry their RFC 5234 meaning.

  record      = field *(SP field) LF
  field       = "-" / 1*fieldchar          ; never empty; "-" means absent
  fieldchar   = %x21-7E / %x80-10FFFF      ; no SP, LF, CR, or TAB survives emission

  ref         = [path "@"] name ["::" slot]
  path        = 1*(ALPHA / DIGIT / "." / "_" / "/" / "-")
                                           ; project-root-relative, ".yass.yaml" removed
  name        = 1*(ALPHA / DIGIT / "." / "_" / "-")
  slot        = "INPUT" / "RETURN" / "ERROR" / "SIDE-EFFECT" / "INVARIANT"
  keyword     = "MUST" / "MUST-NOT" / "SHOULD" / "SHOULD-NOT" / "MAY" / "WHEN"
  relation    = "CONFORMS" / "USES" / "SEE"

  ; list: one record per spec and design document
  list-rec    = kind SP ref SP detail LF
  kind        = "spec" / "design"
  detail      = slotlist / typeword / "-"
  slotlist    = slot *("," slot)           ; canonical slot order, never authored order

  ; find: one record per matching field
  find-rec    = ref SP what SP text LF
  what        = keyword / "content"
  text        = 1*fieldchar *(SP 1*fieldchar)

  ; refs: one record per distinct edge
  refs-rec    = relation SP ref LF

  ; plan: one record per spec document, in implementation order
  plan-rec    = ref LF

  ; validate: one finding per violation, on stdout
  finding-rec = path ":" 1*DIGIT ": " code SP message LF
  code        = 1*(%x61-7A / DIGIT / "." / "_")
  message     = 1*fieldchar *(SP 1*fieldchar)

  ; show emits a YAML fragment rather than records: the addressed document
  ; and any appended design, separated by a "---" line, with no preamble.

  Canonical slot order, wherever a slot sequence is emitted:
  INPUT, RETURN, ERROR, SIDE-EFFECT, INVARIANT.

  Canonical relation order, wherever a relation sequence is emitted:
  CONFORMS, USES, SEE.
