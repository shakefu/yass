# yaml-language-server: $schema=https://shakefu.github.io/yass/v1.schema.json
---
description: >
  The graph-hygiene subcommand. `yass lint` reports what is well formed but wrong about a
  spec set as a whole — a design nothing binds, a document no reference chain reaches, a
  missing schema modeline, a root file that supplies no single named origin for
  reachability, an empty slot, a spec with no slot, an unresolved question left in a file, a
  keyword written into prose, an obligation holding more than one requirement, source code
  or a Markdown table inside a design, an obligation stating a fact a catalog already
  records — each as one coded advisory.
  It runs its own checks and never runs validation first, so a spec set that is being
  authored can still be linted; a file that would not parse is reported as an advisory of its
  own, because reachability computed over a partial graph can be wrong.
version: v1
---
spec: Lint
INPUT:
- MUST: "be invoked as `yass lint [PATH...]`"
- MUST: take the project file set, whatever PATH selects, because reachability and reference counting are properties of the whole graph
  CONFORMS: 01-locate@FileSet::RETURN
- MUST: take the loaded model of every file in that set
  CONFORMS: 02-load@Load::RETURN
- MUST-NOT: rely on any well-formedness guarantee of that model beyond the fact that a file parsed, and re-check no rule the language definition states as a rejection
  SEE: 08-validate@Validate
- WHEN: the model records no entry for a file of the project file set
  MUST: report code yass.internal
- WHEN: no PATH is given
  MUST: report advisories for every file of the project file set
- WHEN: a PATH is given
  MUST: report advisories only for the files that PATH selects, together with yass.lint.no_origin, while still building the graph from the whole project file set
- MUST-NOT: run validation, refuse to run because a file is invalid, or suppress an advisory because a file violates a rule, so lint stays usable on a spec set being written
  SEE: 08-validate@Validate
RETURN:
- MUST: emit one diagnostic per advisory
  USES: root@DiagnosticFormat
- MUST: "set the SEVERITY of every advisory to `warn`"
- MUST: "set the SEVERITY of every diagnostic it reports other than an advisory to `error`"
- WHEN: a design is the target of no USES reference anywhere in the project file set
  MUST: emit code yass.lint.design_unreferenced naming the design at the line it starts on, because a design nothing binds is declared normative content with no force
  SEE: ../yass@Design
- WHEN: a spec or design under the project root is reached by no chain of CONFORMS, USES, and SEE edges beginning at the root file's spec
  MUST: emit code yass.lint.unreachable naming the document at the line it starts on
  CONFORMS: ../yass@Root::INVARIANT
- MUST: count a reference edge toward reachability regardless of its relation, so CONFORMS, USES, and SEE weigh the same
  CONFORMS: ../yass@Root::INVARIANT
- MUST-NOT: emit yass.lint.unreachable for the root file's own spec, since it is the origin of the chain rather than a member of it
- MUST-NOT: emit a graph advisory, or an advisory about an obligation or about design content, for a spec or design whose name is missing or empty, since no ref target can locate it
- WHEN: "a file's first line is not the schema modeline `# yaml-language-server: $schema=https://shakefu.github.io/yass/v1.schema.json`"
  MUST: emit code yass.lint.modeline naming the file at line 1, since an editor then validates the file against no schema
- WHEN: a spec declares a slot whose obligation list is empty
  MUST: emit code yass.lint.slot_empty naming the spec and the slot at the line of the slot's key
- WHEN: a spec declares no slot at all
  MUST: emit code yass.lint.spec_empty naming the spec at the line it starts on, because it states no obligation and can bind nothing
  SEE: ../yass@Spec
- WHEN: "a line of a selected file holds, outside a backtick code span, `TBD`, `TODO`, `FIXME`, or `XXX` as a whole word in capitals, the phrase `open question` in any casing, or the characters `??`, whatever that line holds: a key, a value, or a comment"
  MUST: emit code yass.lint.open_question at that line, because a spec is a contract and its implementer builds an undecided point as a guess
  SEE: ../yass@Document::INVARIANT
- WHEN: "the prose of an obligation's normativity keyword or of its guard, or the description of a preamble, holds outside a backtick code span a `?` that ends the value or is followed by whitespace"
  MUST: emit code yass.lint.open_question at the line of that obligation or description, because a question in a spec is a decision nobody made
  SEE: ../yass@Document::INVARIANT
- WHEN: "the prose of an obligation's normativity keyword begins with `when`, `if`, `unless`, or `whenever` in any casing, or holds outside a backtick code span a comma or semicolon followed by whitespace and one of those words in lower case"
  MUST: emit code yass.lint.prose_keyword at the line of that obligation, because a condition written into prose is an unguarded obligation whose condition a reader can miss
  SEE: ../yass@Guard
- WHEN: "the prose of an obligation's normativity keyword or of its guard holds outside a backtick code span `MUST`, `SHOULD`, `MAY`, or `WHEN` as a whole word in capitals"
  MUST: emit code yass.lint.prose_keyword at the line of that obligation, because a keyword inside prose packs a second obligation or a guard into text no reader parses as one
  SEE: ../yass@Obligation::RETURN
- WHEN: "the prose of an obligation's normativity keyword or of its guard holds outside a backtick code span a `@` followed by a letter or an underscore, the form of a ref target that names another file"
  MUST: emit code yass.lint.prose_keyword at the line of that obligation, because a reference written into prose is an edge no command follows
  SEE: ../yass@Reference
- WHEN: "the prose of an obligation's normativity keyword holds more than 400 characters"
  MUST: emit code yass.lint.obligation_shape at the line of that obligation, because prose that long carries a mechanism rather than one requirement
  SEE: ../yass@Obligation::RETURN
- WHEN: "the prose of an obligation's normativity keyword or of its guard holds outside a backtick code span `:=`, `interface {`, or an opening brace followed by a capitalized word and `: `"
  MUST: emit code yass.lint.obligation_shape at the line of that obligation, because code in prose is an implementation the reader transcribes
  SEE: ../yass@Design
- WHEN: "the prose of an obligation's normativity keyword or of its guard holds outside a backtick code span `and then`, `which then`, `after that`, or `afterwards` in any casing"
  MUST: emit code yass.lint.obligation_shape at the line of that obligation, because a sequence of steps is a procedure, which a design states
  SEE: ../yass@Design
- WHEN: "the prose of an obligation's normativity keyword or of its guard holds outside a backtick code span a semicolon followed by a space, or a period or exclamation mark that ends no abbreviation, followed by spaces and a capital letter"
  MUST: emit code yass.lint.obligation_shape at the line of that obligation, because each clause is a requirement of its own
  USES: Abbreviations
  SEE: ../yass@Obligation::RETURN
- WHEN: "the prose of an obligation's normativity keyword or of its guard holds outside a backtick code span an opening parenthesis followed by `so`, `because`, or `since` and a space, in any casing"
  MUST: emit code yass.lint.obligation_shape at the line of that obligation, because an aside carries a second claim the reader cannot check
- WHEN: "the prose of an obligation outside an `ERROR` slot holds outside a backtick code span `map`, `maps`, or `mapping`, then one of `its`, `the`, `every`, `each`, `all`, `any`, or `other`, an optional word, and `error` or `errors`, in any casing"
  MUST: emit code yass.lint.obligation_shape at the line of that obligation, because a failure's outcome is an `ERROR` obligation
  SEE: ../yass@Slot.ERROR
- WHEN: "a line of the string content of a design whose `type` is `schema` or `algorithm` holds outside a backtick code span a function definition in Go, Python, JavaScript, or Rust, a statement ending in a semicolon that assigns or calls, a Go declaration assigned from a qualified call or a composite literal, a Go map, slice, or address-of composite literal, a control-flow keyword opening a brace block, a Go `err != nil` check, or an import or package clause"
  MUST: emit code yass.lint.design_code at that line, because source in a real language is an implementation the reader transcribes rather than a shape or a computation the implementer writes
  USES: SourcePatterns
  SEE: ../yass@Design
- MUST-NOT: emit yass.lint.design_code for a bare assignment that ends in no semicolon, a `for each` loop, a guard closed by `then` or by a colon, or an unqualified or dotted call that ends no statement, since pseudocode in an algorithm writes each of those
  SEE: ../yass@Design
- WHEN: "a line of a design's string content, or of a string field value of its catalogue records, holds a pipe and the next line is a Markdown table delimiter row of dashes divided by pipes"
  MUST: emit code yass.lint.design_table at the first of those lines, because a Markdown table is a second syntax no tool checks and its rows belong in a catalog
  SEE: ../yass@Design
- MUST: take as a catalogue every design of the project file set whose type is catalog and whose content is a mapping, whatever PATH selects, skipping a record that is not a mapping, a repeated identifier after its first record, and a field value that is not a scalar
  SEE: ../yass@Design
- MUST: take each key of a catalogue as an identifier, except a key of digits alone, because prose writes a number as a quantity far more often than as the name of a record
- MUST: "match an identifier case-sensitively as a whole token of an obligation's guard and prose with backticks removed, a token being bounded by any character other than a letter, a digit, or an underscore, save a dot, hyphen, slash, or `@` followed by one of those"
- MUST: take as the values a field of a catalogue can take the values its records hold, together with every key of its vocabulary when the field is vocabulary-backed
- MUST: treat a field of a catalogue as vocabulary-backed when every value its records hold is a key of exactly one other catalogue, called its vocabulary
- MUST: take as the wordings of a field value the value itself and, for a vocabulary-backed field, every field value of the vocabulary record keyed by it
- MUST: treat a wording of one word as stated only where it equals a whitespace-separated word of the obligation exactly, in any casing, with edge punctuation trimmed and without stemming, and a context word lies one to three words before or after it
- MUST: take as context words the words of the field's name and, for a vocabulary-backed field, of the vocabulary's name, each name split at case changes and at every character other than a letter or a digit
- MUST: count a nearby word as a context word when one of its runs of letters and digits has the stem of a context word
  USES: Stem
- MUST: treat a wording of several words as stated wherever it occurs in any casing as a whole phrase
- MUST: treat a vocabulary wording of at most eight runs of letters and digits holding at least two content words as stated also wherever every one of its content words occurs
  USES: FunctionWords
- MUST: compare a context word or a content word by its stem
  USES: Stem
- WHEN: "an obligation's guard or prose names an identifier and states, outside every identifier it names, a wording of a value that a field of the identifier's catalogue can take, or names an identifier whose catalogue has a vocabulary-backed field and holds `as when`, `as for`, `as if`, or `as though`"
  MUST: emit code yass.lint.restated_fact at the line of that obligation, whether the stated value agrees with the record or not, because a fact stated outside its catalogue is a second source that drifts
  SEE: ../yass@Design::RETURN
- WHEN: an obligation's guard and prose name no identifier of a catalogue, the obligation carries no USES reference to that catalogue or to the vocabulary of the field, and they state a wording of a value that some record of that catalogue holds in a vocabulary-backed field
  MUST: emit code yass.lint.restated_value at the line of that obligation, with a message naming the value, its field, and its catalogue, because the obligation states a fact of a record without saying which record
  SEE: ../yass@Design::RETURN
- MUST-NOT: emit yass.lint.restated_value for a value that no record holds, since such a value is an outcome that no catalogued identifier carries
- MUST: "treat yass.lint.restated_value as experimental: its patterns may change between releases while its rate of false advisories is measured"
- MUST: "treat as a backtick code span the text between a backtick and the next backtick on the same line, so a keyword or marker a spec mentions rather than uses is written inside one"
- MUST: emit at most one advisory of a given code at a given line
- WHEN: one obligation meets more than one condition of yass.lint.prose_keyword
  MUST: "give its one yass.lint.prose_keyword advisory the message of the first condition that holds, in this order: a condition written into prose, a keyword, a reference"
- WHEN: one obligation meets more than one condition of yass.lint.obligation_shape
  MUST: "give its one yass.lint.obligation_shape advisory the message of the first condition that holds, in this order: excess length, code, a procedure, several clauses, a rationale aside, an error mapping"
- MUST: take a slot to hold the lines from its own key up to the next slot key or the next document
- WHEN: an open-question, prose-keyword, or obligation-shape advisory falls on a line a slot holds
  MUST: name that slot as the advisory's location
- WHEN: an open-question, prose-keyword, or obligation-shape advisory falls on a line no slot holds but a document holds
  MUST: name that document as the advisory's location
- WHEN: an open-question, prose-keyword, or obligation-shape advisory falls on a line no document holds
  MUST: name the file as the advisory's location
- WHEN: "the project root's `root.yass.yaml` yields a parse failure, carries no spec, or carries more than one"
  MUST: emit code yass.lint.no_origin naming the root file with no line, emit every advisory that does not depend on reachability, and emit no yass.lint.unreachable, because reachability has no single origin
  CONFORMS: ../yass@Root::ERROR
- WHEN: "the project root's `root.yass.yaml` carries one spec whose name is missing, empty, or not a string"
  MUST: emit code yass.lint.no_origin naming the root file at that spec's line, emit every advisory that does not depend on reachability, and emit no yass.lint.unreachable, because reachability has no origin a reference could address
  CONFORMS: ../yass@Spec::ERROR
- WHEN: a file of the project file set yielded a parse failure
  MUST: emit code yass.lint.unparsed naming that file at the line its parse failure carries, and emit every other advisory anyway, because a partial graph can yield a false reachability advisory and the reader must know the graph was partial
  SEE: 02-load@Load::RETURN
- MUST: order advisories by byte-wise ascending project-root-relative file path, then by ascending line, then by code in byte order
- WHEN: no advisory is produced and no failure is reported
  MUST: write nothing at all and exit with the ok status
  USES: root@Brevity
ERROR:
- WHEN: at least one advisory was emitted
  MUST: exit with the findings status after writing all of them
- WHEN: a PATH does not exist
  MUST: report code yass.io.missing naming it
- WHEN: "a PATH exists but is neither a directory nor a regular file"
  MUST: report code yass.io.not_a_spec_file naming it
- WHEN: a file of the project file set cannot be read at all
  MUST: report code yass.io.unreadable naming it
- MUST: report code yass.internal for any failure not matched by a guarded obligation in this slot
- MUST: exit with the status the request-failure catalogue gives each code this spec reports to end a request
  USES: root@RequestFailures
SIDE-EFFECT:
- MUST: write every advisory of the RETURN slot to standard output, because an advisory is this command's product
  USES: root@OutputPolicy
- MUST: write to standard error every diagnostic this command reports other than an advisory, in whichever slot it is stated, because each names a failure to examine the project rather than a result of examining it
- MUST-NOT: modify a file to clear an advisory
INVARIANT:
- MUST-NOT: emit an advisory that repeats a diagnostic validation emits, so the two commands partition the checks between them and a reader runs both without reading anything twice
  SEE: 08-validate@Validate
- MUST-NOT: judge the wording, ordering, granularity, or completeness of an obligation, so no advisory depends on understanding prose
- MUST: match fixed character patterns, and weigh nothing they match, in the open-question, prose-keyword, obligation-shape, design-code, design-table, restated-fact, and restated-value advisories
- MUST-NOT: judge whether a slot states a residual, since that is a property of what obligations say rather than of the graph
  SEE: ../yass@Slot.ERROR
- MUST-NOT: cross a project root boundary when computing reachability, so a nested project's documents are reached from that project's own root spec
  SEE: ../yass@Root
- MUST-NOT: emit an advisory under a code no obligation of this project defines
  USES: root@DiagnosticFormat
---
design: FunctionWords
type: constraint
content: |
  A content word is a run of the characters a to z and 0 to 9, taken from text after it is
  lower-cased, that is not digits alone, holds four or more characters, and is none of these
  function words:

    about, also, been, does, each, from, have, into, only, other, some, than, that, their,
    then, there, this, what, when, which, with, were
---
design: Stem
type: algorithm
content: |
  stem(word):
    for each suffix in "ing", "es", "ed", "s", in that order
      if word ends with suffix and at least 3 characters remain without it then
        remove suffix from the end of word
        stop trying suffixes
    if word ends with "e" and at least 3 characters remain without it then
      remove the final "e"
    return word
---
design: SourcePatterns
type: constraint
content: |
  A line holds source code when it matches any of the patterns below. Whitespace means one
  or more spaces or tabs, optional whitespace means none or more, and a name is a letter,
  a digit, or an underscore repeated one or more times.

  Function definitions, each at the start of a line after optional indentation:

  - Go: the word `func`, whitespace, an optional receiver in parentheses, a name, optional
    whitespace, and an opening parenthesis.
  - Python: the word `def`, optionally preceded by `async`, a name, a parenthesized
    parameter list, an optional `->` return annotation, and a colon that ends the line.
  - JavaScript: the word `function`, optionally preceded by `export`, `async`, or both in
    that order, an optional name, a parenthesized parameter list, and an opening brace.
  - Rust: the word `fn`, optionally preceded by `pub`, a name, optional whitespace, and an
    opening angle bracket or parenthesis.

  Statements ending in a semicolon, each at the start of a line after optional indentation,
  with the semicolon last on the line apart from trailing whitespace:

  - An assignment: a target that begins with a letter or an underscore and goes on in
    letters, digits, underscores, dots, square brackets, or asterisks, then optional
    whitespace, one of `=`, `:=`, `+=`, or `-=`, optional whitespace, a character that is
    neither `=` nor whitespace, and any text.
  - A call: a run of name characters and dots beginning with a letter or an underscore, an
    opening parenthesis right after it, any text, and a closing parenthesis.

  Go shapes, anywhere in a line:

  - A declaration: a name character, `:=` with optional whitespace on either side, an
    optional `&`, a name beginning with a letter or an underscore, a dot, and more names
    joined by dots, followed at once by an opening parenthesis or an opening brace.
  - A map literal: `map[` at the start of a word, a key type of name characters, dots, or asterisks, `]`, a value
    type of name characters, dots, asterisks, or square brackets, and an opening brace.
  - A slice literal: `[]`, an optional asterisk, a type name of name characters and dots
    beginning with a letter or an underscore, and an opening brace.
  - An address-of literal: `&`, a type name of name characters and dots beginning with a
    letter or an underscore, and an opening brace.
  - An error check: the word `err`, optional whitespace, `!=`, optional whitespace, and the
    word `nil`.

  Control flow: a line that begins, after optional indentation and an optional closing brace,
  with `if`, `else if`, `for`, `while`, or `switch` as a whole word and ends with an opening
  brace, or a line that begins with a closing brace, the word `else`, and an opening brace.

  Import and package clauses, each at the start of a line after optional indentation:

  - `import` followed by an opening parenthesis, a double quote, or a dotted name and a
    semicolon.
  - `from`, a dotted name, `import`, and a name.
  - `#include` followed by an opening angle bracket or a double quote.
  - `package` and a dotted name that end the line, with an optional semicolon.
  - `use`, whitespace, a run of name characters and colons, and a semicolon right after it.
---
design: Abbreviations
type: constraint
content: |
  Abbreviations whose closing period ends no sentence, matched case-sensitively at the start
  of a word: `e.g.`, `i.e.`, `etc.`, `vs.`, and `cf.`.
