# yaml-language-server: $schema=https://textla.dev/yass/v1.schema.json
---
description: >
  The retrieval command. Emits exactly one addressed document as a yass fragment, with its
  slot-targeted CONFORMS references inlined and its bound design blocks appended, so an
  agent reads one spec in full without opening the file that holds it.
version: v1
related:
- ../context/yass-reference.md
---
spec: Show
INPUT:
- MUST: accept the loaded model
  CONFORMS: 01-load@Load::RETURN
- MUST: rely on every document in the model carrying a resolvable address and its obligations in authored order, and re-read no file to confirm either
- MUST: rely on those guarantees holding without a violation case of its own, because loading exits before any command runs when a file cannot be parsed
  SEE: 01-load@Load::ERROR
- MUST: "accept exactly one positional argument, a RefTarget of the form `[<path>@]<Name>[::<SLOT>]`"
- MAY: "accept the `--raw` option"
- WHEN: "the argument omits the `<path>@` prefix"
  MUST: resolve the name against every document in the project through the bare-name index
- WHEN: "the argument carries the `<path>@` prefix"
  MUST: resolve against the single document holding that name at that path
- WHEN: "the argument carries a `::<SLOT>` suffix"
  MUST: restrict the emitted fragment to that one slot
RETURN:
- MUST: emit the addressed document as a YAML fragment carrying no preamble
- MUST: "emit a `---` line before every document of the fragment except the first"
- MUST: preserve the authored order of slots within the document and of obligations within a slot
- MUST: "quote an emitted obligation value that contains `: `, so the fragment re-parses as YAML"
- WHEN: "the argument carries a `::<SLOT>` suffix"
  MUST: "emit a spec document carrying its `spec` key and that slot alone"
- WHEN: "the `--raw` option is absent"
  MUST: resolve the fragment's references before emitting it
  USES: ResolutionOrder
- WHEN: "the `--raw` option is given"
  MUST: emit the document exactly as authored, resolving no reference and emitting no provenance comment
ERROR:
- WHEN: the number of positional arguments is not exactly one
  MUST: report code yass.args.arity and exit 2
- WHEN: the argument is not well-formed against the RefTarget grammar
  MUST: report code yass.ref.malformed and exit 2
- WHEN: "the argument names a slot outside INPUT, RETURN, ERROR, SIDE-EFFECT, and INVARIANT"
  MUST: report code yass.ref.unknown_slot and exit 2
- WHEN: a bare name matches more than one document in the project
  MUST: "report code yass.ref.ambiguous, emit one record per candidate to stdout in the `<kind> <ref> <detail>` form the index command uses, and exit 2"
  SEE: 02-list@List::RETURN
- WHEN: the argument matches no document in the project
  MUST: report code yass.ref.not_found and exit 1
- WHEN: "the `::<SLOT>` suffix names a slot the addressed spec does not declare"
  MUST: report code yass.ref.absent_slot and exit 1
- WHEN: "the `::<SLOT>` suffix is applied to an argument that resolves to a design"
  MUST: report code yass.ref.slot_on_design and exit 2
- WHEN: "the `--raw` option is absent and a reference carried by the addressed document does not resolve"
  MUST: report code yass.ref.dangling and exit 2
- WHEN: "the `--raw` option is absent and a CONFORMS reference targets a design, or a USES reference targets a spec or slot"
  MUST: report code yass.ref.kind_mismatch and exit 2
INVARIANT:
- CONFORMS: 00-output@Output
- MUST: emit a fragment that re-parses as a YAML stream of one or more documents
- MUST: emit a provenance comment naming the source reference on every inlined obligation and every appended design
- MUST-NOT: emit any comment beside those provenance comments
- MUST-NOT: "emit the host file's preamble, path, or `description`"
- MUST-NOT: emit a document the addressed document's own references do not reach
- MUST-NOT: resolve a reference more than one level deep, so a reference carried by an inlined obligation or an appended design stays unresolved
- MUST-NOT: reword, reflow, truncate, or summarize an obligation
- MUST-NOT: fail for any reason beside those its ERROR slot names and the loading failures it inherits
  SEE: 01-load@Load
---
design: ResolutionOrder
type: ordered-steps
content: |
  Resolve one level only. Never recurse into a fragment already resolved.

  1. Start from the addressed document. When a `::SLOT` suffix was given, drop
     every other slot before doing anything else.
  2. Walk the retained slots in authored order, and each slot's obligations in
     authored order. For each obligation, act on its relation key:
     a. CONFORMS with a `::SLOT` target -> splice the referenced slot's
        obligations into this slot, immediately before the carrier obligation,
        each spliced obligation preceded by the comment
        `# CONFORMS: <target>`
     b. CONFORMS with a whole-spec target -> leave the obligation in place.
        A whole-spec CONFORMS is a conformance reference, not a transclusion.
     c. USES -> record the referenced design for step 4. Splice nothing; a
        design carries no obligations to splice.
     d. SEE -> leave the obligation in place. SEE is never inlined.
  3. When a spliced obligation carries its own WHEN and the carrier obligation
     also carried a WHEN, emit the spliced obligation with both conditions
     conjoined, in the form
        <carrier condition> and <spliced condition>
     because the spliced obligation applies only when both hold.
  4. Append each recorded design as its own document after the spec, in the
     order the designs were first referenced, once per design however many
     obligations referenced it, each preceded by the comment
     `# USES: <target>`
  5. Emit. Provenance comments are the only comments the fragment carries.
