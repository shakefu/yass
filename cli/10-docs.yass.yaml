# yaml-language-server: $schema=https://shakefu.github.io/yass/v1.schema.json
---
description: >
  The `yass docs` subcommand. One Spec, serving the language documents this program carries
  inside itself: with no operand it indexes the corpus, and with a name it writes that
  document whole. The corpus is built into the program rather than read from the file tree,
  because an agent holding this program does not hold the checkout those documents live in.
  It is the one command whose answer is about the yass language rather than about the spec
  set under the starting directory.
version: v1
related:
- ../context/BRAINSTORMING.md
- ../context/AUTHORING.md
- ../context/DOCUMENTS.md
- ../context/OBLIGATIONS.md
- ../context/REFERENCES.md
- ../context/COVERAGE.md
- ../context/IMPLEMENTING.md
- ../yass.yass.yaml
---
spec: Docs
INPUT:
- MUST: "be invoked as `yass docs [NAME]`"
- MUST: take the parsed operands invocation yielded, relying on it to have rejected a second NAME
  CONFORMS: 00-invocation@Invocation::RETURN
- MUST: recognize exactly the names the corpus declares, and no other
  USES: Corpus
- MUST: match NAME against a corpus name byte-for-byte, so no name resolves by abbreviation, by prefix, or in another casing
- WHEN: NAME is omitted
  MUST: index the corpus rather than write a document
- WHEN: NAME is given and names a corpus document
  MUST: write that document whole
- MUST-NOT: load, parse, or address a spec file, since no answer of this command comes from the file tree
  SEE: 02-load@Load
RETURN:
- WHEN: NAME is omitted
  MUST: write one docs record for each document of the corpus, in the order the corpus declares them
  USES: root@RecordFormat
- WHEN: NAME names a corpus document holding at most 200 lines
  MUST: write that document's text to standard output byte-for-byte as the corpus carries it, adding no header, no footer, no provenance comment, and no trailing summary
- WHEN: NAME names a corpus document holding more than 200 lines
  MUST: "write first one line holding `# yass docs `, NAME, `: `, the count of lines the document holds in decimal, and ` lines total. Read every line; a read cut short drops rules.`, then the document's text byte-for-byte as the corpus carries it, adding nothing else"
  USES: root@Brevity
- WHEN: NAME names a corpus document
  MUST: write the document as a text stream rather than as records, since a document is prose and not a sequence of fields
  SEE: root@RecordFormat
- MUST: exit with the ok status once the index or the document is written
- MUST: write the index and the document to standard output, because each is what was asked for
  USES: root@OutputPolicy
ERROR:
- WHEN: NAME is not a name the corpus declares
  MUST: report code yass.docs.unknown naming NAME, write no document, and exit with the unresolved status
- MUST: report code yass.internal and exit with the environment status for any failure not matched by a guarded obligation in this slot
- MUST-NOT: "name the recognized document names in a diagnostic, since an invocation with no operand is the index and the reader recovers from it without being told"
  USES: root@Brevity
SIDE-EFFECT:
- MUST-NOT: read, create, modify, delete, or rename any file or directory, since every document it serves is carried inside the program
  CONFORMS: root@YassCli::SIDE-EFFECT
- MUST: write every diagnostic in this slot to standard error, since the index and the served document are the only things this command puts on standard output
  USES: root@OutputPolicy
INVARIANT:
- MUST: carry exactly the documents named authoritative for the yass language or for writing specs in it, so the corpus stays a language corpus and does not grow into a general file store
  USES: Corpus
- MUST-NOT: carry a project's own spec file as a corpus document, since `query`, `list`, `find`, and `refs` serve those from the tree
  USES: Corpus
- MUST: carry each corpus document as a copy of its source file, taken from the checkout and embedded when the program is built
  USES: Corpus
- MUST: fail a test of this program when a carried copy has drifted from the source it was taken from
  USES: Corpus
- MUST-NOT: "carry a document under an embedded name ending in `.yass.yaml`, since every file with that suffix under a project root is collected as a document of that project"
- MUST: order the documents of each reading path so a task reads the path whole, every document in order
  USES: ReadingPaths
- MUST: keep each corpus document to one cohesive topic that no other corpus document restates, so a reading path read in order covers its task once
  USES: ReadingPaths
- MUST: open each markdown corpus document with a line naming its reading path and its place in that path
  USES: ReadingPaths
- WHEN: a markdown corpus document is followed by another document on its reading path
  MUST: close it with a line naming that next document
  USES: ReadingPaths
- WHEN: a markdown corpus document ends its reading path
  MUST: close it with a line saying the path ends
  USES: ReadingPaths
- MUST-NOT: require the opening or closing path line of the language definition, since it is a spec file whose length line stands in for them
  SEE: Docs::RETURN
- MUST: "set each docs record's `WHEN` field to the task that earns the cost of reading that document, so a reader spends its context on a corpus document only when its own task matches"
  USES: Corpus
- MUST: route an agent implementing code against an existing spec set to one corpus document, since `overview` summarizes the notation it reads and the spec files hold the behaviour it produces
  USES: ReadingPaths
- MUST-NOT: write a corpus document from `overview`, since a corpus document costs hundreds of lines of a reader's context and is served on demand for that reason
  SEE: 11-overview@Overview
- MUST: serve text identical to the source document the corpus was built from, after the length line where one is written, so a reader of the served copy and a reader of the checkout read the same words
- MUST: compute the length line's count from the carried text each time the document is served, so the count cannot drift from the text
- SHOULD: carry each document within 200 lines, dividing a long topic into cohesive documents a reading path orders, so the length line is the exception
  USES: Corpus
- MUST-NOT: carry a Markdown table in any document, because an agent copies the shape of what it reads into the specs it writes, and a spec has no table
- MUST-NOT: require a project root, discover one, or vary its answer with the starting directory, since the corpus is a property of the program and not of a tree
- MUST-NOT: resolve, validate, lint, summarize, or otherwise interpret a document it serves, since this command is a courier and the language it carries is not its subject
---
design: Corpus
type: catalog
content:
  brainstorming: {source: context/BRAINSTORMING.md, when: "eliciting a spec set with a user: elicit path, then the write path"}
  authoring: {source: context/AUTHORING.md, when: "writing or changing a spec: write path 1 of 5"}
  documents: {source: context/DOCUMENTS.md, when: "writing or changing a spec: write path 2 of 5"}
  obligations: {source: context/OBLIGATIONS.md, when: "writing or changing a spec: write path 3 of 5"}
  references: {source: context/REFERENCES.md, when: "writing or changing a spec: write path 4 of 5"}
  coverage: {source: context/COVERAGE.md, when: "writing or changing a spec: write path 5 of 5"}
  implementing: {source: context/IMPLEMENTING.md, when: "implementing code and tests against an approved spec set: implement path"}
  language: {source: yass.yass.yaml, when: "changing the yass language itself, then the write path"}
---
design: ReadingPaths
type: catalog
content:
  elicit: {documents: "brainstorming, then the write path"}
  write: {documents: "authoring, documents, obligations, references, coverage"}
  language: {documents: "language, then the write path"}
  implement: {documents: implementing}
