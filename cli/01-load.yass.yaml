# yaml-language-server: $schema=https://textla.dev/yass/v1.schema.json
---
description: >
  Locating the project, discovering its spec files, and parsing them into the in-memory
  model every command reads. This is the one place the filesystem is touched; every
  command downstream works from the model alone.
version: v1
related:
- ../yass.yass.yaml
- ../context/yass-reference.md
---
spec: ProjectRoot
INPUT:
- MAY: "accept a directory path from the global `--root` option"
- WHEN: "no `--root` option is given"
  MUST: start from the current working directory
RETURN:
- WHEN: "the `--root` option is given"
  MUST: "use that directory as the project root without searching, requiring it to contain a file named exactly `root.yass.yaml`"
- WHEN: "no `--root` option is given"
  MUST: "search upward from the starting directory, inclusive of it, for a directory containing a file named exactly `root.yass.yaml`, and take the nearest such directory"
- MUST: inspect the starting directory itself before its parent
- MUST: yield the project root as an absolute path
- MUST: compute the project root exactly once per invocation
ERROR:
- WHEN: "the `--root` value names a path that is not an existing directory"
  MUST: report code yass.root.not_a_directory and exit 2
- WHEN: "the `--root` value names a directory that holds no `root.yass.yaml`"
  MUST: report code yass.root.missing and exit 2
- WHEN: "the upward search reaches the filesystem root without finding a `root.yass.yaml`"
  MUST: report code yass.root.not_found and exit 2
- WHEN: a directory on the upward path cannot be read
  MUST: report code yass.root.unreadable and exit 2
INVARIANT:
- MUST: "locate the project root by the filename `root.yass.yaml` alone"
- MUST-NOT: "infer a project root from a `.git` directory, a package manifest, a build directory, or the presence of any other `.yass.yaml` file"
- MUST-NOT: descend into a child directory or move sideways during the search
- MUST-NOT: "expand `~` or an environment variable inside the `--root` value"
- MUST-NOT: resolve a symbolic link before deciding the project root
---
spec: Discover
INPUT:
- MUST: accept the project root
  CONFORMS: ProjectRoot::RETURN
- MUST: rely on the project root being an absolute path to an existing directory, and re-check neither property
- WHEN: the project root is no longer an existing directory when traversal begins
  MUST: report code yass.root.not_a_directory and exit 2
RETURN:
- MUST: "walk the project-root subtree recursively and yield every regular file whose basename ends with the literal suffix `.yass.yaml`"
- MUST: "require at least one character before the `.yass.yaml` suffix, so the bare basename `.yass.yaml` does not match"
- MUST: yield each path relative to the project root
- MUST: "emit `/` as the path separator on every platform"
- MUST: sort the yielded paths by byte order of that relative path
- MUST: "yield the project root's own `root.yass.yaml` as part of the set"
ERROR:
- WHEN: a directory inside the subtree cannot be listed
  MUST: report code yass.walk.unreadable naming that directory and continue with its siblings
- WHEN: a file that matched the suffix cannot be opened for reading
  MUST: report code yass.file.unreadable naming that file and exit 2
- WHEN: the subtree holds no matching file
  MUST: report code yass.walk.empty and exit 2
INVARIANT:
- MUST: "compare the `.yass.yaml` suffix byte-for-byte and case-sensitively on every platform"
- MUST-NOT: "descend into a directory whose name begins with `.`"
- MUST-NOT: "yield a file whose basename begins with `.`"
- MUST-NOT: follow a symbolic link, treating every symbolic link met during the walk as absent
- MUST-NOT: "cross into a nested project root, treating a subdirectory that holds its own `root.yass.yaml` as absent"
- MUST-NOT: "match a file ending in `.yaml` without the `.yass` infix"
- MUST-NOT: expand a glob, a tilde, or an environment variable
---
spec: Load
INPUT:
- MUST: accept the discovered file list
  CONFORMS: Discover::RETURN
- MUST: rely on every listed path existing and being readable, both established during discovery
- WHEN: a listed path is unreadable when parsing reaches it
  MUST: report code yass.file.unreadable and exit 2
- MUST: read each file as UTF-8 and parse it as a YAML 1.2 stream under the core schema
- MUST: "treat `yes`, `no`, `on`, and `off` as plain strings rather than booleans"
RETURN:
- MUST: yield one in-memory model holding every document of every discovered file
  USES: LoadSequence
- MUST: record for each document its file path, its position within that file, its kind, and its name
- MUST: record for each spec document the slots it declares and, per slot, each obligation's normativity keyword, guard condition, prose, and references, in authored order
- MUST: "record for each design document its `type` and its `content`"
- MUST: "record for each preamble its `description`, its `version`, and its `related` list"
- MUST: "address every document by the RefTarget `<path>@<name>`, where `<path>` is the project-root-relative path with the `.yass.yaml` suffix removed"
- MUST: index documents by bare name as well, so a bare name resolves to every document across the project that carries it
- MUST: record one reference edge per authored reference, keeping the declaring document, its slot, the relation, and the target string verbatim
ERROR:
- WHEN: a file is not well-formed YAML
  MUST: report code yass.parse.invalid with the offending line and exit 2
- WHEN: a file's first document carries a spec key or a design key, so the file has no preamble
  MUST: report code yass.parse.no_preamble and exit 2
- WHEN: a document after the first carries neither a spec key nor a design key
  MUST: report code yass.parse.unknown_document and exit 2
- WHEN: a mapping in a file carries a duplicate key
  MUST: report code yass.parse.duplicate_key and exit 2
- MUST: reject a file only for the YAML-level and document-shape failures this slot names, loading every other document even when it violates a yass rule so that validate reports the violation
  SEE: 06-validate@Validate
INVARIANT:
- MUST: load the whole project exactly once per invocation, before any command produces output
- MUST: preserve every obligation's prose byte-for-byte as authored
- MUST-NOT: write any record to stdout when loading fails
- MUST-NOT: resolve, fetch, or validate a preamble `related` entry
- MUST-NOT: reorder documents, slots, or obligations while loading
- MUST-NOT: create, modify, or delete any file
- MUST-NOT: cache the model on disk, in a temporary directory, or in a configuration directory
---
design: LoadSequence
type: ordered-steps
content: |
  1. Resolve the project root. Fail with exit 2 the moment it is absent; no
     command runs without one.
  2. Walk the project-root subtree for files ending in `.yass.yaml`, skipping
     dot-entries, symbolic links, and any subdirectory holding its own
     `root.yass.yaml`. Fail with exit 2 on an empty result.
  3. Parse each file, in sorted relative-path order, as a YAML 1.2 stream.
  4. Within each file, classify document 0 as the preamble, and classify every
     later document by whether it carries a `spec` key or a `design` key.
  5. Build the document index, keyed by `<path>@<name>`, and the bare-name
     index, keyed by `<name>`, holding every document that carries that name.
  6. Build the reference index: one edge per authored reference, recorded as
     (declaring document, declaring slot, relation, target string). Keep
     duplicates here so validate can see them; de-duplicate only at emission.
  7. Hand the model to the dispatched command.

  No step in this sequence writes to disk, and no step resolves a reference.
  Reference resolution is a reader's concern, performed against the indexes
  built in steps 5 and 6.
