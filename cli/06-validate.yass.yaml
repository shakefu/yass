# yaml-language-server: $schema=https://textla.dev/yass/v1.schema.json
---
description: >
  The checking command. Reports every yass rule the spec set violates, one finding per
  line, and stays silent when the set is clean, so an agent can gate on it with exit
  status alone and pay context only for what is actually wrong.
version: v1
related:
- ../yass.yass.yaml
- ../yass.v1.schema.json
---
spec: Validate
INPUT:
- MUST: accept the loaded model
  CONFORMS: 01-load@Load::RETURN
- MUST: rely on every file in the model having parsed as YAML, and check every yass rule itself rather than assume any of them
- MUST: rely on that one guarantee holding without a violation case of its own, because loading exits before any command runs when a file cannot be parsed
  SEE: 01-load@Load::ERROR
- MAY: accept zero or more positional paths, each naming a file whose documents are to be checked
- WHEN: no positional path is given
  MUST: check every document beneath the project root
- WHEN: at least one positional path is given
  MUST: check the documents of those files only, while still resolving references against the whole project
RETURN:
- MUST: "emit one finding per line to stdout, in the form `<path>:<line>: <code> <message>`"
  CONFORMS: 00-output@Diagnostic::RETURN
- MUST: write nothing at all to stdout when every checked document is valid
- MUST: order findings by file path in byte order, then by line number ascending, then by code in byte order
- MUST: report every violation the checked documents exhibit in one run, rather than stopping at the first
- WHEN: a checked file carries no preamble as its first document
  MUST: emit a finding with code yass.preamble.missing
- WHEN: "a preamble omits `description` or `version`"
  MUST: emit a finding with code yass.preamble.incomplete
- WHEN: "a preamble's `version` is not the exact string `v1`"
  MUST: emit a finding with code yass.preamble.version
- WHEN: "a preamble carries a key beside `description`, `version`, and `related`"
  MUST: emit a finding with code yass.preamble.unknown_key
- WHEN: "a preamble's `related` value is present and is not a sequence of strings"
  MUST: emit a finding with code yass.preamble.related_shape
- WHEN: a spec or design name does not match the name grammar the language defines
  MUST: emit a finding with code yass.name.malformed
- WHEN: a spec or design name case-insensitively matches a slot, normativity, guard, or relation keyword
  MUST: emit a finding with code yass.name.keyword
- WHEN: two documents in one file carry the same name
  MUST: emit a finding with code yass.name.duplicate
- WHEN: a spec carries a key that is neither the spec key nor a recognized slot
  MUST: emit a finding with code yass.slot.unknown
- WHEN: "a design omits `type` or `content`, or carries a key beside `design`, `type`, and `content`"
  MUST: emit a finding with code yass.design.shape
- WHEN: a design carries a slot key
  MUST: emit a finding with code yass.design.slot
- WHEN: an obligation carries more than one normativity keyword
  MUST: emit a finding with code yass.obligation.multiple_normativity
- WHEN: an obligation carries neither a normativity keyword nor a reference
  MUST: emit a finding with code yass.obligation.empty
- WHEN: an obligation carries a WHEN guard and no normativity keyword
  MUST: emit a finding with code yass.obligation.guard_alone
- WHEN: an obligation's value at a scalar position is a mapping, a sequence, or null
  MUST: emit a finding with code yass.obligation.not_scalar
- WHEN: an obligation carries the same relation key more than once
  MUST: emit a finding with code yass.obligation.duplicate_relation
- WHEN: a reference target is not well-formed against the RefTarget grammar
  MUST: emit a finding with code yass.ref.malformed
- WHEN: a reference target names a file, a document, or a slot that does not exist
  MUST: emit a finding with code yass.ref.dangling
- WHEN: a CONFORMS target resolves to a design
  MUST: emit a finding with code yass.ref.conforms_design
- WHEN: a USES target resolves to a spec or a slot
  MUST: emit a finding with code yass.ref.uses_spec
- WHEN: "a `::<SLOT>` target names a slot the referenced spec does not declare"
  MUST: emit a finding with code yass.ref.absent_slot
- WHEN: "a `::<SLOT>` suffix is applied to a target that resolves to a design"
  MUST: emit a finding with code yass.ref.slot_on_design
- WHEN: "the project root's `root.yass.yaml` carries no spec, or carries more than one"
  MUST: emit a finding with code yass.root.spec_count
- WHEN: a spec or design beneath the project root is reached by no chain of CONFORMS, USES, or SEE edges beginning at the root spec
  MUST: emit a finding with code yass.graph.unreachable
- WHEN: a design is the target of no USES and no SEE edge
  MUST: emit a finding with code yass.design.unreferenced
ERROR:
- WHEN: a positional path does not exist, is not a regular file, or is not beneath the project root
  MUST: report code yass.args.path and exit 2
- WHEN: "a positional path does not end with the literal suffix `.yass.yaml`"
  MUST: report code yass.args.bad_extension and exit 2
- WHEN: an option beside the global options is given
  MUST: report code yass.args.unknown_option and exit 2
INVARIANT:
- CONFORMS: 00-output@Output
- MUST: exit 1 when it emitted at least one finding, and exit 0 when it emitted none
  SEE: 00-output@ExitCode
- MUST: emit a finding on stdout and reserve stderr for this command's own process failures
- MUST: report a finding for each distinct violation, even when one document exhibits several
- MUST-NOT: modify, reformat, rewrite, or repair any file
- MUST-NOT: judge the substance of an obligation's prose, checking only structure and references
- MUST-NOT: stop after the first finding
- MUST-NOT: fail for any reason beside those its ERROR slot names and the loading failures it inherits
  SEE: 01-load@Load
