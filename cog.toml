tag_prefix = "v"
ignore_merge_commits = true

# Build the release archives into dist/ before the bump commit + tag are
# created. The release workflow attaches dist/* to the GitHub release; a
# failed build fails the bump, so a broken tree can't be tagged. The formula
# is regenerated from those archives' checksums and staged by the hook, so
# the bump commit carries a Homebrew formula matching the release.
pre_bump_hooks = [
    "script/build {{version}}",
    "script/gen-formula {{version}}",
]
