[book]
title = "yass"
description = "YAML specification language for AI-agent-driven development"
authors = ["yass contributors"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/shakefu/yass"
default-theme = "rust"
preferred-dark-theme = "navy"
smart-punctuation = true

[output.html.search]
enable = true
limit-results = 30

[output.html.fold]
enable = true
level = 0
