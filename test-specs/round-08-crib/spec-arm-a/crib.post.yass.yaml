# yaml-language-server: $schema=https://textla.dev/yass/v1.schema.json
---
description: >
  crib post: the post subcommand. It reads ledger records from standard input
  and applies each accepted record to the stock ledger in the store, writing
  one acknowledgement line per accepted record and one error line per rejected
  record. Each invocation is a separate process; the applied records must be
  visible to any later invocation.
version: v1
related:
- ./crib.shared.yass.yaml
- ./crib.report.yass.yaml
---
spec: crib.post
INPUT:
- MUST: run when the program's first command-line argument is post
- MUST: "segment standard input into records and fields exactly as the shared segmentation rules state"
  CONFORMS: ./crib.shared@crib.lines::INPUT
- MUST: "interpret a well-formed ledger record as exactly three fields, `<KEYWORD> <id> <qty>`: a keyword that is exactly STOCK or exactly ISSUE, compared case-sensitively; a well-formed tool identifier -- 1 to 6 characters, its first character an ASCII uppercase letter (A-Z), every character an ASCII uppercase letter (A-Z) or an ASCII digit (0-9); and a well-formed non-negative integer quantity -- a non-empty run of ASCII digits (0-9) with no leading zero, unless the field is the single digit 0"
- MUST: "apply each accepted record to the ledger state in the store the CribStore design fixes, in input order"
  USES: ./crib.shared@CribStore
RETURN:
- MUST: "apply an accepted record by first ensuring the tool's row exists, creating it at balance 0 if absent, then adjusting the balance: a STOCK record adds its quantity, and an ISSUE record subtracts its quantity; an accepted record therefore always leaves the tool's row present, so an accepted ISSUE of quantity 0 for a never-stocked tool creates its row at balance 0"
- MUST: "write, for each accepted record in input order, the line `<id> OK <balance>` to standard output, where <balance> is the tool's stored balance after the record is applied"
- MUST: "commit every accepted record's effect to the store before the process exits, so that it is visible to any later invocation"
  USES: ./crib.shared@CribStore
- MUST: "exit with status 0 when no record was rejected, and with status 1 when at least one record was rejected; the usage, E50, and E51 failures exit with status 2 as the shared spec states"
ERROR:
- WHEN: a record splits into zero fields, such as a blank or whitespace-only line
  MUST: "emit `E10 malformed record: empty line` to standard error and write no standard-output line for that record"
- WHEN: a record has one or more fields and its first field is neither STOCK nor ISSUE
  MUST: "emit `E25 unknown operation: <field1>` to standard error, where <field1> is the record's first field exactly as read, and write no standard-output line for that record"
- WHEN: a record's first field is exactly STOCK or exactly ISSUE and the record does not have exactly three fields
  MUST: "emit `E10 malformed record: <KEYWORD> expects 3 fields, got <n>` to standard error, where <KEYWORD> is the record's first field and <n> is its actual field count, and write no standard-output line for that record"
- WHEN: a record has exactly three fields and a well-formed keyword but its second field is not a well-formed tool identifier
  MUST: "emit `E15 bad tool id: <field2>` to standard error, where <field2> is the record's second field exactly as read, and write no standard-output line for that record"
- WHEN: a record has exactly three fields, a well-formed keyword, and a well-formed tool identifier but its third field is not a well-formed non-negative integer
  MUST: "emit `E20 bad number: <field3>` to standard error, where <field3> is the record's third field exactly as read, and write no standard-output line for that record"
- WHEN: a record is a well-formed ISSUE but its quantity exceeds the tool's current stored balance, counting a tool with no row as balance 0
  MUST: "emit `E30 insufficient stock: <id>` to standard error, write no standard-output line for that record, and change nothing: the balance is unchanged and no row is created"
- MUST: "apply the checks above in the order they are stated, stopping at the first failure, with at most one error line per record"
  CONFORMS: ./crib.shared@crib.errors::INVARIANT
- MUST: "treat the record checks as exhaustive: every record is either rejected by exactly one of the E10 empty-line, E25 unknown-operation, E10 field-count, E15 identifier, E20 number, or E30 insufficient-stock checks, or accepted and applied; the residual set is empty, so no guard-less catch-all error obligation MUST be stated, since it could never fire"
SIDE-EFFECT:
- MUST-NOT: "write to any file or environment variable, and contact no network endpoint other than the database the CribStore design fixes"
- SHOULD-NOT: hold more than one record's output lines in memory before writing them
INVARIANT:
- MUST: "read each ISSUE record's current balance from the store as it stands when the record is applied, so that a change made by another database client before this invocation governs the E30 decision"
  USES: ./crib.shared@CribStore
