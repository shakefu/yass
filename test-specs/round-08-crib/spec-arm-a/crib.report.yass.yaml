# yaml-language-server: $schema=https://textla.dev/yass/v1.schema.json
---
description: >
  crib report: the report subcommand. It reads the current stock ledger from
  the store and writes one line per tool plus a total. It reads nothing of
  substance from standard input and trusts the store's contents exactly as
  stored, including rows other database clients changed since the last post.
version: v1
related:
- ./crib.shared.yass.yaml
- ./crib.post.yass.yaml
---
spec: crib.report
INPUT:
- MUST: run when the program's first command-line argument is report
- MUST: "ignore the content of standard input; the shared rule to read all of standard input before writing any output still applies, but no byte of it affects the report"
- MUST: "read the current ledger state from the store the CribStore design fixes -- the table's contents exactly as stored at this invocation, including rows inserted, updated, or deleted by other database clients since any earlier invocation"
  USES: ./crib.shared@CribStore
RETURN:
- MUST: "write one line `<id> <balance>` per tool row present in the store, including a row whose balance is 0, sorted ascending by byte order of <id>"
- MUST: "report each stored balance exactly as read, including a balance another client set outside the E30 rule, such as a negative one"
- MUST: "write, after the tool lines, exactly one final line `TOTAL <sum>`, where <sum> is the exact integer sum of the listed balances, possibly negative; when the store holds no rows the output is the single line `TOTAL 0`"
- MUST: "exit with status 0; the usage, E50, and E51 failures exit with status 2 as the shared spec states"
SIDE-EFFECT:
- MUST-NOT: "change any ledger state, write to any file or environment variable, or contact any network endpoint other than the database the CribStore design fixes; write nothing to standard error"
  USES: ./crib.shared@CribStore
INVARIANT:
- MUST: "produce output that is a pure function of the table's contents at this invocation, never of any earlier invocation's memory"
