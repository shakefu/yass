# yaml-language-server: $schema=https://textla.dev/yass/v1.schema.json
---
description: >
  Shared conventions for the crib tool-ledger. The tool is one command-line
  program with two subcommands -- post and report -- each invocation of which
  is a separate process: post applies ledger records read from standard input,
  and report writes the current stock, so state must survive between
  invocations. This document is the single home for the cross-cutting rules
  every subcommand obeys: how the program selects a subcommand and what it
  does when the selection is absent or unknown, what happens when the store is
  unconfigured or unreachable, how a subcommand segments its standard input
  into records and fields, and the shape of a processing-error line. It also
  carries the crib.store spec, which fixes where all ledger state lives.
version: v1
related:
- ./crib.post.yass.yaml
- ./crib.report.yass.yaml
---
spec: crib
INPUT:
- MUST: read all of standard input before writing any output
- MUST: "select a subcommand from the closed set of exactly post and report using the first command-line argument"
- WHEN: the first command-line argument is present and is exactly post or report
  MUST: "run that subcommand: post as defined by the crib.post spec, and report as defined by the crib.report spec"
- MUST: "connect to the store and ensure its table exists on every valid-subcommand invocation, before processing any records, so that an invocation with empty standard input still creates the table and a store failure is reported even then"
  USES: crib.store
- SEE: ./crib.post@crib.post
- SEE: ./crib.report@crib.report
ERROR:
- WHEN: the first command-line argument is missing, or is any token other than exactly post or report -- including an unknown word, a wrong-case token such as POST or REPORT, or a bare hyphen
  MUST: "write the line `usage: crib {post|report}` to standard error, write nothing to standard output, and exit with status 2; this decision is made before any store contact, so it needs no database"
- WHEN: the subcommand is valid but the CRIB_PGDSN environment variable the crib.store spec requires is unset or empty
  MUST: "write the line `E50 no database configured` to standard error, write nothing to standard output, and exit with status 2"
  USES: crib.store
- WHEN: the subcommand is valid and CRIB_PGDSN is set but the database cannot be reached or the connection is refused
  MUST: "write the line `E51 database unavailable` to standard error, write nothing to standard output, and exit with status 2"
- WHEN: the subcommand is valid and the connection succeeded but the store fails afterward -- a failed table creation, a lost connection, or any other database error during processing
  MUST: "write the line `E51 database unavailable` to standard error and exit with status 2; output already written stands, and no further records are processed"
INVARIANT:
- MUST: "terminate every line written to standard output or standard error with a single newline byte (0x0A), and write no other line-terminator byte"
- MUST: "echo any input-derived text in a message, such as a rejected field or a tool identifier, byte-for-byte exactly as it was read"
- SHOULD: write each record's output lines as soon as that record has been processed, keeping output in input order
---
spec: crib.lines
INPUT:
- MUST: "read the entire standard input as raw bytes and preserve every byte exactly, so that bytes which are not valid UTF-8 round-trip unchanged to any output"
- WHEN: standard input is completely empty, containing zero bytes
  MUST: treat it as zero records and perform no splitting
- MUST: "when the input is non-empty and its final byte is a single newline (0x0A), strip exactly that one trailing newline before splitting; strip no more than one, so that a second trailing newline leaves a final empty record"
- MUST: "split the remaining bytes into records on each single newline byte (0x0A); each record is the text between newlines, in input order"
- MUST: "treat an input consisting of exactly one newline byte as one record with zero fields, because stripping its single trailing newline leaves an empty remainder that splits into exactly one empty record"
- MUST: "treat a record that splits into zero fields, such as a blank line or a whitespace-only line, as a record with zero fields"
- MUST: "split a record into fields on runs of one or more ASCII space bytes (0x20), discarding leading and trailing ASCII spaces, so that no empty field is produced and an interior run of spaces collapses to a single field boundary"
- MUST-NOT: "treat any byte other than the ASCII space (0x20) -- including the tab (0x09) and the carriage return (0x0D) -- as a field separator; any such byte is ordinary field data"
---
spec: crib.errors
INVARIANT:
- MUST: "write every processing-error line to standard error as an error code, a single ASCII space, then its message, terminated by one newline byte: `<code> <message>`"
- MUST: write at most one processing-error line for any single input record
---
spec: crib.store
SIDE-EFFECT:
- MUST: "persist all ledger state in the PostgreSQL database reachable via the connection URL in the CRIB_PGDSN environment variable -- a standard PostgreSQL URL of the form postgres://user:password@host:port/dbname, provided by the operator at run time and accepted by any standard PostgreSQL client library"
- MUST: "create, on first use, its own table, named crib_stock, with a column tool_id (text, the unique key) and a column balance (an integer of at least 64-bit range); creation is idempotent, so a later invocation that finds the table already present leaves it as is"
- MUST: "commit every accepted record's effect to the database before the process exits"
INVARIANT:
- MUST-NOT: "persist state anywhere else: no files, no other databases, and no caches that outlive the process; each invocation is a fresh process, and this database is the only carrier of ledger state between invocations"
- MUST: "treat the crib_stock table as shared: rows inserted, updated, or deleted by other database clients between invocations are authoritative, and every invocation reads and reports the table's current contents, never a remembered or shadow copy"
