# yaml-language-server: $schema=https://textla.dev/yass/v1.schema.json
---
description: >
  granary allot: the allot subcommand and the producer of the allot | tally
  pipeline. It reads a pool header and a manifest of claims from standard
  input, rejects malformed claim records with the error registry, computes
  each accepted claim's allotted units by the largest-remainder allotment this
  spec states, and writes one GET line per accepted claim plus a final REMAIN
  line.
version: v1
related:
- ./granary.shared.yass.yaml
- ./granary.tally.yass.yaml
---
spec: granary.allot
INPUT:
- MUST: run when the program's first command-line argument is allot
- MUST: "segment standard input into records and fields exactly as the shared segmentation rules state"
  CONFORMS: ./granary.shared@granary.lines::INPUT
- MUST: "require the first record of standard input to be the pool header: exactly two fields, `POOL <units>`, where the first field is exactly POOL and <units> is a well-formed non-negative integer -- a non-empty run of ASCII digits (0-9) with no leading zero, unless the field is the single digit 0"
- WHEN: standard input contains zero records, or the first record is not a well-formed pool header -- including a blank first record, a wrong field count, a first field other than exactly POOL, or a malformed <units>
  MUST: "emit `E40 bad pool header` to standard error, write nothing to standard output, process no further records, and exit with status 2"
- MUST: "treat every record after the pool header as a claim record: exactly three fields, `CLAIM <id> <weight>`, where the keyword is exactly CLAIM, <id> is a well-formed claim identifier -- 1 to 6 characters, its first character an ASCII uppercase letter (A-Z), every character an ASCII uppercase letter (A-Z) or an ASCII digit (0-9) -- and <weight> is a well-formed non-negative integer as defined for the pool header"
- MUST: "let only the accepted claim records participate in the allotment: the participation total is the sum of the accepted claims' weights, accumulated from zero, and a rejected record contributes nothing to the total and receives nothing"
ERROR:
- WHEN: a record after the pool header splits into zero fields, such as a blank or whitespace-only line
  MUST: "emit `E10 malformed record: empty line` to standard error and write no GET line for that record"
- WHEN: a record after the pool header has one or more fields and its first field is not exactly CLAIM
  MUST: "emit `E25 unknown operation: <field1>` to standard error, where <field1> is the record's first field exactly as read, and write no GET line for that record"
- WHEN: a record's first field is exactly CLAIM and the record does not have exactly three fields
  MUST: "emit `E10 malformed record: CLAIM expects 3 fields, got <n>` to standard error, where <n> is the record's actual field count, and write no GET line for that record"
- WHEN: a record has exactly three fields and the keyword CLAIM but its second field is not a well-formed claim identifier
  MUST: "emit `E15 bad claim id: <field2>` to standard error, where <field2> is the record's second field exactly as read, and write no GET line for that record"
- WHEN: a record has exactly three fields, the keyword CLAIM, and a well-formed claim identifier but its third field is not a well-formed non-negative integer
  MUST: "emit `E20 bad number: <field3>` to standard error, where <field3> is the record's third field exactly as read, and write no GET line for that record"
- MUST: "apply the claim checks above in the order they are stated, stopping at the first failure, with at most one error line per record"
  CONFORMS: ./granary.shared@granary.errors::INVARIANT
- MUST: "treat the claim-record checks as exhaustive: every record after the header is either rejected by exactly one of the E10 empty-line, E25 unknown-operation, E10 field-count, E15 identifier, or E20 number checks, or accepted as a claim; the residual set is empty, so no guard-less catch-all error obligation MUST be stated, since it could never fire"
RETURN:
- WHEN: the participation total is 0, because there are no accepted claims or every accepted weight is 0
  MUST: "allot 0 units to every accepted claim and leave the whole pool unallotted; no base-share, remainder, or distribution computation runs"
- WHEN: the participation total is greater than 0
  MUST: "give each accepted claim a base share equal to (pool * weight) // total -- the integer floor, rounded down per claim at this step; never rounded half-up, and never rounded at the end instead"
- WHEN: the participation total is greater than 0
  MUST: "give each accepted claim a remainder equal to (pool * weight) - (base * total), an exact integer; remainders are compared as these integers, never as floating-point fractions"
- WHEN: the participation total is greater than 0
  MUST: "distribute exactly the leftover -- the pool minus the sum of all base shares -- as one extra unit per claim to the first leftover claims in this precedence order: larger remainder first; equal remainders broken by smaller base first; still equal broken by later input position first; no claim receives more than one extra unit, and when the leftover is 0 the distribution runs zero times"
- MUST: "write one line `<id> GET <units>` per accepted claim, in the claims' input order regardless of any distribution order, where <units> is that claim's base share plus its extra unit, if it received one"
- MUST: "write, after all GET lines, exactly one final line `REMAIN <r>`, where <r> is the pool minus the sum of all allotted units -- 0 whenever the participation total is greater than 0, and the whole pool when the total is 0 or there are no accepted claims; the REMAIN line is written even when there are no accepted claims"
- MUST: "exit with status 0 when no claim record was rejected, and with status 1 when at least one claim record was rejected; the pool-header failure exits with status 2 as stated above"
SIDE-EFFECT:
- MUST-NOT: "write to any file, network endpoint, or environment variable; read only standard input and write only standard output and standard error"
- SHOULD-NOT: buffer more output than one record's lines beyond what the stated output order requires
INVARIANT:
- MUST: "perform every allotment computation in exact arbitrary-precision integer arithmetic with no floating point anywhere; the only rounding is the single per-claim floor stated above"
- MUST: "the sum of every GET line's <units> plus the REMAIN line's <r> equals the pool exactly, on every run that passes the pool-header gate"
