# yaml-language-server: $schema=https://textla.dev/yass/v1.schema.json
---
description: >
  Shared conventions for the kiln firing controller. The tool is one
  command-line program with two subcommands -- fire and report -- each of which
  reads standard input and writes standard output, so they can be chained with a
  shell pipe. This document is the single home for the cross-cutting rules every
  subcommand obeys: how the program selects a subcommand and what it does when
  the selection is absent or unknown, how a subcommand segments its standard
  input into records and fields, the layout of a load record with its error
  registry, and the grade registry for a completed firing. The kiln.fire spec
  is the single home for the firing procedure and the sole normative statement
  of the order in which the firing stages execute.
version: v1
related:
- ./kiln.stages.yass.yaml
- ./kiln.fire.yass.yaml
- ./kiln.report.yass.yaml
---
spec: kiln
INPUT:
- MUST: read all of standard input before writing any output
- MUST: "select a subcommand from the closed set of exactly fire and report using the first command-line argument"
- WHEN: the first command-line argument is present and is exactly fire or report
  MUST: "run that subcommand: fire as defined by the kiln.fire spec, and report as defined by the kiln.report spec"
- SEE: ./kiln.fire@kiln.fire
- SEE: ./kiln.report@kiln.report
ERROR:
- WHEN: the first command-line argument is missing, or is any token other than exactly fire or report -- including an unknown word, a wrong-case token such as FIRE or REPORT, or a bare hyphen
  MUST: "write the line `usage: kiln {fire|report}` to standard error, write nothing to standard output, and exit with status 2"
INVARIANT:
- MUST: "terminate every line written to standard output or standard error with a single newline byte (0x0A), and write no other line-terminator byte"
- MUST: "echo any input-derived text in a message, such as a rejected field or a load identifier, byte-for-byte exactly as it was read"
- SHOULD: write each record's output lines as soon as that record has been processed, so output stays in input order
---
spec: kiln.lines
INPUT:
- MUST: "read the entire standard input as raw bytes and preserve every byte exactly, so that bytes which are not valid UTF-8 round-trip unchanged to any output"
- WHEN: standard input is completely empty, containing zero bytes
  MUST: treat it as zero records and perform no splitting
- MUST: "when the input is non-empty and its final byte is a single newline (0x0A), strip exactly that one trailing newline before splitting; strip no more than one, so that a second trailing newline leaves a final empty record"
- MUST: "split the remaining bytes into records on each single newline byte (0x0A); each record is the text between newlines, in input order"
- MUST: "treat an input consisting of exactly one newline byte as one record with zero fields, because stripping its single trailing newline leaves an empty remainder that splits into exactly one empty record"
- MUST: "treat a record that splits into zero fields, such as a blank line or a whitespace-only line, as a record with zero fields"
- MUST: "split a record into fields on runs of one or more ASCII space bytes (0x20), discarding leading and trailing ASCII spaces, so that no empty field is produced and an interior run of spaces collapses to a single field boundary"
- MUST-NOT: "treat any byte other than the ASCII space (0x20) -- including the tab (0x09) and the carriage return (0x0D) -- as a field separator; any such byte is ordinary field data"
---
spec: kiln.record
INPUT:
- MUST: "interpret a well-formed load record as exactly three fields in this order, written `LOAD <id> <base>`: the keyword LOAD, a load identifier, and a base firing index"
- MUST: "treat the keyword as well-formed only when it is exactly LOAD, compared case-sensitively"
- MUST: "treat a load identifier as well-formed only when it is 2 to 8 characters long, its first character is an ASCII uppercase letter (A-Z), and every character is an ASCII uppercase letter (A-Z) or an ASCII digit (0-9)"
- MUST: "treat the base firing index as well-formed only when it is a non-empty run of ASCII digits (0-9) with no leading zero, unless the field is the single digit 0"
ERROR:
- WHEN: a record splits into zero fields, such as a blank or whitespace-only line
  MUST: "emit `E10 malformed record: empty line` to standard error and write no standard-output line for that record"
- WHEN: a record has one or more fields and its first field is not exactly LOAD
  MUST: "emit `E25 unknown operation: <field1>` to standard error, where <field1> is the record's first field exactly as read, and write no standard-output line for that record"
- WHEN: a record's first field is exactly LOAD and the record does not have exactly three fields
  MUST: "emit `E10 malformed record: LOAD expects 3 fields, got <n>` to standard error, where <n> is the record's actual field count, and write no standard-output line for that record"
- WHEN: a record has exactly three fields and the keyword LOAD but its second field is not a well-formed load identifier
  MUST: "emit `E15 bad load id: <field2>` to standard error, where <field2> is the record's second field exactly as read, and write no standard-output line for that record"
- WHEN: a record has exactly three fields, the keyword LOAD, and a well-formed load identifier but its third field is not a well-formed base firing index
  MUST: "emit `E20 bad number: <field3>` to standard error, where <field3> is the record's third field exactly as read, and write no standard-output line for that record"
INVARIANT:
- MUST: "write every processing-error line to standard error as an error code, a single ASCII space, then its message, terminated by one newline byte: `<code> <message>`"
- MUST: write at most one processing-error line for any single input record, applying the checks above in the order they are stated and stopping at the first failure
- MUST: "classify every record as exactly one of the following: rejected by exactly one of the E10 empty-line, E25 unknown-operation, E10 field-count, E15 identifier, or E20 number checks above; or accepted -- a LOAD record of exactly three fields with a well-formed identifier and a well-formed base firing index; the residual set is empty, so no guard-less catch-all error obligation MUST be stated, since it could never fire"
---
spec: kiln.grade
INVARIANT:
- MUST: "grade each completed firing on its final firing index, which is the running index produced by the last stage of the firing procedure that kiln.fire defines"
- USES: ./kiln.fire@kiln.fire
- WHEN: the final firing index is greater than 2000
  MUST: "the grade is G90, the OVERFIRED verdict: its grade line is `<id> G90 overfired above 2000` and its exit contribution is 3"
- WHEN: the final firing index is less than 500
  MUST: "the grade is G10, the UNDERFIRED verdict: its grade line is `<id> G10 underfired below 500` and its exit contribution is 2"
- WHEN: the final firing index is at least 500 and at most 2000
  MUST: "the grade is DONE: its grade line is `<id> DONE <final>`, where <final> is the final firing index, and its exit contribution is 0"
- MUST: "treat G90, G10, and DONE as exhaustive over every possible final firing index, including a negative one, which is below 500 and therefore G10; there is no residual grade and no guard-less catch-all grade MUST be stated, since it could never fire"
- MUST: "rank exit contributions as 3 for any G90 grade, 2 for any G10 grade, 1 for any rejected record, and 0 for a DONE grade"
