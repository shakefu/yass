# yaml-language-server: $schema=https://textla.dev/yass/v1.schema.json
---
description: >
  The four firing stages of the kiln controller -- RAMP, SEAL, SOAK, and VENT
  -- documented here in alphabetical order. Each stage is one step of the
  firing procedure for an accepted LOAD record: it receives the running firing
  index, applies its own arithmetic, writes exactly one stage line, and hands
  the produced index on. The order in which the stages execute is defined
  solely by the FiringSequence design in the shared file, never by the
  position of these specs in this file.
version: v1
related:
- ./kiln.shared.yass.yaml
- ./kiln.fire.yass.yaml
---
spec: kiln.ramp
INPUT:
- MUST: "receive the load identifier and the running firing index handed to RAMP at RAMP's position in the firing procedure"
- USES: ./kiln.shared@FiringSequence
RETURN:
- MUST: "produce a running firing index equal to exactly twice the received index (received times 2)"
- MUST: "write exactly one stage line `<id> RAMP <index>` to standard output, where <index> is the index this stage produced"
SIDE-EFFECT:
- MUST-NOT: "write anything to standard error or reject any received index; a stage never fails"
---
spec: kiln.seal
INPUT:
- MUST: "receive the load identifier and the running firing index handed to SEAL at SEAL's position in the firing procedure"
- USES: ./kiln.shared@FiringSequence
RETURN:
- MUST: "produce a running firing index equal to the received index minus 220 (received minus 220)"
- MUST: "write exactly one stage line `<id> SEAL <index>` to standard output, where <index> is the index this stage produced"
SIDE-EFFECT:
- MUST-NOT: "write anything to standard error or reject any received index; a stage never fails"
---
spec: kiln.soak
INPUT:
- MUST: "receive the load identifier and the running firing index handed to SOAK at SOAK's position in the firing procedure"
- USES: ./kiln.shared@FiringSequence
RETURN:
- MUST: "produce a running firing index equal to three times the received index (received times 3)"
- MUST: "write exactly one stage line `<id> SOAK <index>` to standard output, where <index> is the index this stage produced"
SIDE-EFFECT:
- MUST-NOT: "write anything to standard error or reject any received index; a stage never fails"
---
spec: kiln.vent
INPUT:
- MUST: "receive the load identifier and the running firing index handed to VENT at VENT's position in the firing procedure"
- USES: ./kiln.shared@FiringSequence
RETURN:
- MUST: "produce a running firing index equal to the received index plus 35 (received plus 35)"
- MUST: "write exactly one stage line `<id> VENT <index>` to standard output, where <index> is the index this stage produced"
SIDE-EFFECT:
- MUST-NOT: "write anything to standard error or reject any received index; a stage never fails"
