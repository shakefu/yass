name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'context/**'
      - 'yass.v1.schema.json'
      - '.github/workflows/docs.yaml'
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'context/**'
      - 'yass.v1.schema.json'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.4.40"
  MDBOOK_SHA256: 9ef07fd288ba58ff3b99d1c94e6d414d431c9a61fdb20348e5beb74b823d546b

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install mdBook
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          asset="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/${asset}" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/${asset}"
          echo "${MDBOOK_SHA256}  ${tmp}/${asset}" | sha256sum --check --strict -
          tar -xzf "${tmp}/${asset}" -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Build documentation
        run: mdbook build docs

      - name: Copy JSON schema into site root
        run: cp yass.v1.schema.json docs/book/v1.schema.json

      - name: Setup Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/book

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
